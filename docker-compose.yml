services:
  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - '9000:9000' # API Port (cho SDK kết nối)
      - '9001:9001' # Web Console Port (Giao diện quản trị)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data:
